<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monlia · Globo voxel</title>
  <style>
    :root {
      --bg: #0d1420;
      --panel: rgba(16, 24, 38, 0.72);
      --text: #e8eef7;
      --muted: #8fa0b8;
      --accent: #f2a65a;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #dfe8f3; --panel: rgba(255, 255, 255, 0.78); --text: #17202e; --muted: #536379; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); }
    canvas { display: block; touch-action: none; }
    #ui {
      position: fixed; top: 16px; left: 16px; max-width: min(320px, calc(100vw - 32px));
      background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 14px; padding: 16px 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }
    h1 { font-size: 17px; margin: 0 0 4px; letter-spacing: 0.2px; }
    p { margin: 0 0 12px; font-size: 13px; line-height: 1.45; color: var(--muted); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      font: inherit; font-size: 13px; color: var(--text); cursor: pointer;
      background: transparent; border: 1px solid var(--muted); border-radius: 999px; padding: 7px 14px;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1b1206; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <h1>Monlia · globo voxel</h1>
    <p>Arraste para girar e use a roda para aproximar. O personagem anda pela superfície e evita a água.</p>
    <div class="actions">
      <button id="newWorld" type="button">Novo mundo</button>
      <button id="follow" type="button" aria-pressed="false">Seguir personagem</button>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
